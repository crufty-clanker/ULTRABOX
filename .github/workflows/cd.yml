name: CD

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.21'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux]
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build for ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          cd server
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags "-s -w -X main.Version=${{ steps.version.outputs.version }}" -o ../toolbox-${{ matrix.os }}-${{ matrix.arch }} .
        env:
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-${{ matrix.os }}-${{ matrix.arch }}
          path: toolbox-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 30

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: toolbox-linux-*
          merge-multiple: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper

      - name: Build Debian package (amd64)
        run: |
          mkdir -p debian/toolbox/usr/local/bin
          mkdir -p debian/toolbox/opt/toolbox
          cp toolbox-linux-amd64 debian/toolbox/usr/local/bin/toolbox
          cp index.html style.css app.js favicon.svg debian/toolbox/opt/toolbox/
          cp -r tools/ debian/toolbox/opt/toolbox/
          sed -i "s/Version: .*/Version: ${{ steps.version.outputs.version }}/" debian/changelog
          dpkg-deb --build debian/toolbox
          mv debian/toolbox.deb toolbox_${{ steps.version.outputs.version }}_amd64.deb

      - name: Upload amd64 package
        uses: actions/upload-artifact@v4
        with:
          name: toolbox_${{ steps.version.outputs.version }}_amd64.deb
          path: toolbox_${{ steps.version.outputs.version }}_amd64.deb
          retention-days: 30

  zip-role:
    name: Zip Ansible Role
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create role archive
        run: |
          cd ansible/roles
          tar -czf toolbox-role-${{ steps.version.outputs.version }}.tar.gz toolbox/

      - name: Upload role
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-role-${{ steps.version.outputs.version }}.tar.gz
          path: ansible/roles/toolbox-role-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, package, zip-role]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: toolbox-*
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
