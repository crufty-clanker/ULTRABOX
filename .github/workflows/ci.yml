name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.21'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-version: '2023.1.6'

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux]
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build for ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          cd server
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags "-s -w -X main.Version=dev" -o ../toolbox-${{ matrix.os }}-${{ matrix.arch }} .
        env:
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: toolbox-${{ matrix.os }}-${{ matrix.arch }}
          path: toolbox-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 7

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: toolbox-linux-*
          merge-multiple: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper

      - name: Build Debian package
        run: |
          mkdir -p debian/toolbox/usr/local/bin
          mkdir -p debian/toolbox/opt/toolbox
          cp toolbox-linux-amd64 debian/toolbox/usr/local/bin/toolbox
          cp index.html style.css app.js favicon.svg debian/toolbox/opt/toolbox/
          cp -r tools/ debian/toolbox/opt/toolbox/
          dpkg-deb --build debian/toolbox

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: toolbox.deb
          path: debian/toolbox.deb
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test ./...
